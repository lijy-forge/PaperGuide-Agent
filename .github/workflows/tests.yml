name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The PDF renderer embeds a CJK face and fails closed without one; the
      # runtime images install the same package (see docker/api/Dockerfile).
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest ruff

      # Lint covers the first-party package only; gpt_researcher/ is inherited.
      - name: Lint
        run: ruff check paperguide/ tests/

      # Scoped to the tests covering the paperguide package. The inherited
      # gpt_researcher tests pass individually but interfere with each other
      # when run as one session, so they are not a usable gate yet.
      - name: Run PaperGuide test suite
        run: |
          set +e
          pytest $(grep -rl paperguide tests/*.py) -q --no-header -rf > pytest.out 2>&1
          code=$?
          cat pytest.out
          # Surface failures as annotations so a red run is diagnosable from the
          # checks API without downloading the full log.
          if [ $code -ne 0 ]; then
            grep -E "^(FAILED|ERROR)" pytest.out | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $code

      - name: Run offline demo pipeline
        env:
          PAPERGUIDE_MODE: demo
        run: python -m paperguide.runtime demo --max-papers 3 --format markdown
