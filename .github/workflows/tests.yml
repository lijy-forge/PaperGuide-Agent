name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest ruff

      # Lint covers the first-party package only; gpt_researcher/ is inherited.
      - name: Lint
        run: ruff check paperguide/ tests/

      # Scoped to the tests covering the paperguide package. The inherited
      # gpt_researcher tests pass individually but interfere with each other
      # when run as one session, so they are not a usable gate yet.
      - name: Run PaperGuide test suite
        run: pytest $(grep -rl paperguide tests/*.py) -q

      - name: Run offline demo pipeline
        env:
          PAPERGUIDE_MODE: demo
        run: python -m paperguide.runtime demo --max-papers 3 --format markdown
