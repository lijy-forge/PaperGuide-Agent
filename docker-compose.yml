name: paperpilot

x-python-environment: &python-environment
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PAPERPILOT_MODE: ${PAPERPILOT_MODE:-production}
  PAPERPILOT_LLM_PROVIDER: ${PAPERPILOT_LLM_PROVIDER:-openai}
  PAPERPILOT_MODEL_NAME: ${PAPERPILOT_MODEL_NAME:-gpt-5.4}
  PAPERPILOT_EXPORT_DIRECTORY: /app/data/artifacts
  PAPERPILOT_MAX_PAPERS: ${PAPERPILOT_MAX_PAPERS:-10}
  PAPERPILOT_LOG_LEVEL: ${PAPERPILOT_LOG_LEVEL:-INFO}

services:
  host:
    build:
      context: .
      dockerfile: docker/host/Dockerfile
    image: paperpilot-host:local
    init: true
    restart: unless-stopped
    environment:
      <<: *python-environment
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
    volumes:
      - paperpilot-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from paperpilot.runtime import RuntimeSettings; from paperpilot.runtime.host import SQLiteHostBroker; settings=RuntimeSettings.from_env(); raise SystemExit(0 if SQLiteHostBroker(settings.task_database_path()).host_available() else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    cpus: 2.0
    mem_limit: 3g
    stop_grace_period: 45s

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: paperpilot-api:local
    init: true
    restart: unless-stopped
    command:
      - uvicorn
      - paperpilot.api.app:create_default_api_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      <<: *python-environment
    volumes:
      - paperpilot-data:/app/data
    ports:
      - "127.0.0.1:${PAPERPILOT_API_PORT:-8000}:8000"
    depends_on:
      host:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    cpus: 1.0
    mem_limit: 1g

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
      args:
        VITE_PAPERPILOT_API_BASE_URL: ${VITE_PAPERPILOT_API_BASE_URL:-http://localhost}
    image: paperpilot-dashboard:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PAPERPILOT_DASHBOARD_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    cpus: 0.5
    mem_limit: 256m

volumes:
  paperpilot-data:
    name: paperpilot-data
